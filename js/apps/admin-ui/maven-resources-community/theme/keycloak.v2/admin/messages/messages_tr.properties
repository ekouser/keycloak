removeInvalidUsersHelp=Aramalar yürütülürken kullanıcı depolama alanından erişilemiyorsa kullanıcıları yerel veritabanından kaldır. Bu doğruysa, artık karşılık gelen kullanıcı depolama alanından erişilemeyen kullanıcılar, kullanıcıları aramaya çalışıldığında yerel veritabanından silinir. Yanlışsa, daha önce kullanıcı depolama alanından içe aktarılan kullanıcılar, artık kullanıcı depolama alanından erişilemiyor olsa bile yerel veritabanında salt okunur ve devre dışı olarak tutulur. Örneğin, kullanıcı doğrudan LDAP'den silindi veya `Kullanıcıların DN'si` geçersiz. Bu davranışın yalnızca kullanıcı henüz önbelleğe alınmadığında gerçekleşeceğini unutmayın.