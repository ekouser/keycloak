unmanagedAttributesHelpText=Yönetilmeyen özellikler, kullanıcı profili ayarlarında açıkça tanımlanmamış kullanıcı öznitelikleridir. \
Varsayılan olarak, yönetilmeyen özellikler `Devre Dışı`dır ve kayıt, hesap ve yönetim konsolu gibi herhangi bir bağlamdan kullanılamaz. \
`Etkin` olarak ayarlandığında, yönetilmeyen öznitelikler sunucu tarafından tamamen tanınır ve tüm bağlamlar aracılığıyla erişilebilir. Bu, mevcut bir alanı bildirimsel kullanıcı profiline taşımaya başlıyorsanız ve henüz kullanıcı profili yapılandırmasında tüm kullanıcı özelliklerini tanımlamadıysanız yararlıdır. \
`Yalnızca yöneticiler yazabilir` olarak ayarlandığında, yönetilmeyen özellikler yalnızca yönetim konsolu ve API aracılığıyla değiştilebilir. Bu, kullanıcılar tarafından yönetilebilen herhangi bir kişiselleştirilmiş özellik tanımladıysanız fakat bunu yalnızca yöneticiler tarafından yönetilmesi gereken diğer özelliklere eklemekten emin değilseniz yararlıdır. \
`Yalnızca yöneticiler görüntüleyebilir` olarak ayarlandığında, yönetilmeyen öznitelikler salt okunur olur ve yalnızca yönetim konsolu ve API aracılığıyla kullanılabilir.
